<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポートフォリオ</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- ヘッダー -->
  <header class="bg-indigo-600 text-white py-8 text-center">
    <h1 class="text-5xl font-bold">あやねんのポートフォリオ</h1>
    <p class="text-3xl mt-2 text-indigo-200">POSSEでプログラミングを学んでいます</p>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-12 space-y-16">

    <!-- 自己紹介 -->
    <section>
      <h2 class="text-2xl font-bold mb-4">自己紹介</h2>
      <p class="text-gray-600 leading-relaxed">
        こんにちは！Web制作を学んでいます。
      </p>
    </section>

    <!-- スキルリスト -->
    <section>
      <h2 class="text-2xl font-bold mb-4">スキル</h2>
      <ul class="flex flex-wrap gap-2">
        <li class="transition-all duration-200 hover:scale-105
                   bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm">
          HTML
        </li>
        <li class="transition-all duration-200 hover:scale-105
                   bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm">
          Tailwind CSS
        </li>
        <li class="transition-all duration-200 hover:scale-105
                   bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm">
          JavaScript
        </li>
      </ul>
    </section>

    <!-- 作品スライダー -->
    <section>
      <h2 class="text-2xl font-bold mb-4">作品</h2>
      <section class="splide" aria-label="作品スライダー">
        <div class="splide__track">
          <ul class="splide__list">
            <li class="splide__slide">
              <img src="./works/298587653_744119000003285_4341071262267205530_n_17993462017503202.jpg" alt="作品1"
                   class="w-full h-120 rounded-lg object-cover hover:scale-105 transition-transform duration-300">
            </li>
            <li class="splide__slide">
              <img src="./works/298848866_845908766384794_2062561315449608203_n_18149602534267285.jpg" alt="作品2"
                   class="w-full h-120 rounded-lg object-cover hover:scale-105 transition-transform duration-300">
            </li>
          </ul>
        </div>
      </section>
    </section>

  </main>

  <!-- フッター -->
  <footer class="bg-gray-800 text-gray-400 text-center py-6 mt-16">
    <p>2026 あやねんの部屋</p>
    <p>無断転載を禁止します</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
